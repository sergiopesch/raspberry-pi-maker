name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        openclaw-version:
          - "2026.5.22"
          - "2026.10.5"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package dependencies
        run: |
          python3 vendor/dev/verify.py
          npm ci --no-audit --no-fund --engine-strict

      - name: Audit the complete development dependency graph
        run: npm audit --audit-level=low

      - name: Verify the owned development npm compatibility
        run: npm run check:dev-sdk

      - name: Install minimum host for compatibility checks
        if: matrix.openclaw-version != '2026.10.5'
        run: npm install --global --no-audit --no-fund --engine-strict "openclaw@${{ matrix.openclaw-version }}"

      - name: Validate repository and code syntax
        run: |
          npm test
          node --check index.js
          npm run plugin:validate

      - name: Check registration with the minimum host SDK
        if: matrix.openclaw-version != '2026.10.5'
        run: |
          mv node_modules/openclaw "$RUNNER_TEMP/build-sdk"
          ln -s "$(npm root --global)/openclaw" node_modules/openclaw
          node --test test/plugin.test.js

      - name: Validate native plugin metadata
        env:
          EXPECTED_OPENCLAW_VERSION: ${{ matrix.openclaw-version }}
        run: |
          if [ "$EXPECTED_OPENCLAW_VERSION" = "2026.10.5" ]; then
            host_cli="$PWD/node_modules/openclaw/openclaw.mjs"
          else
            host_cli="$(npm root --global)/openclaw/openclaw.mjs"
          fi
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import { dirname, join } from "node:path"; const actual = JSON.parse(readFileSync(join(dirname(process.argv[1]), "package.json"), "utf8")).version; if (actual !== process.env.EXPECTED_OPENCLAW_VERSION) throw new Error(`Expected host ${process.env.EXPECTED_OPENCLAW_VERSION}, got ${actual}`);' "$host_cli"
          node "$host_cli" --version
          node "$host_cli" plugins build --root . --entry ./index.js --check
          node "$host_cli" plugins validate --root . --entry ./index.js

      - name: Restore the audited development SDK before packing
        if: always() && matrix.openclaw-version != '2026.10.5'
        run: |
          if [ -d "$RUNNER_TEMP/build-sdk" ]; then
            test -L node_modules/openclaw
            rm node_modules/openclaw
            mv "$RUNNER_TEMP/build-sdk" node_modules/openclaw
          fi

      - name: Prove package contents
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          python3 vendor/dev/check_pack.py "$RUNNER_TEMP"/raspberry-pi-maker-*.tgz

      - name: Verify native installation of the runtime archive
        env:
          EXPECTED_OPENCLAW_VERSION: ${{ matrix.openclaw-version }}
        run: |
          if [ "$EXPECTED_OPENCLAW_VERSION" = "2026.10.5" ]; then
            host_root="$PWD/node_modules/openclaw"
          else
            host_root="$(npm root --global)/openclaw"
          fi
          node vendor/dev/native_install_smoke.mjs "$RUNNER_TEMP"/raspberry-pi-maker-*.tgz "$host_root"
